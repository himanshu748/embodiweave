name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned CPU stack
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-mujoco.txt
      - name: Start pinned FalkorDB
        run: |
          docker run -d --name ew-ci -p 127.0.0.1:6379:6379 falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
          for i in $(seq 1 30); do
            if [ "$(docker exec ew-ci redis-cli ping)" = PONG ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test real validation and graph boundaries
        run: python -m pytest -q
      - name: Fresh compose launch
        run: |
          docker compose up --build --wait --wait-timeout 180
          python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/status')); expected=json.load(open('evidence/robustness-v2/selected.json'))['policy_id']; assert s['graph']['up'] and s['deployed_policy']==expected; q=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/robustness/lineage')); assert len(q['rows'])==4 and len(q['origins']['rows'])==5"
          python -c "import json,urllib.request; s=json.load(open('web/media/physics-evidence.json')); q=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/physics/lineage')); assert len(q['rows'])==8*len(s['attempts'])"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop owned containers
        if: always()
        run: |
          docker compose down
          docker rm -f ew-ci
